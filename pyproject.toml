[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiamat"
version = "0.1.0"
description = "Quantitative secondary-market MTG arbitrage and forecasting terminal"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[tool.black]
line-length = 100
target-version = ["py310"]